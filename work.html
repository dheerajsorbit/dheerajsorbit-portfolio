<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Work — Dheeraj Kumar | Product Designer</title>
  
  <!-- Primary Meta Tags for SEO -->
  <meta name="title" content="Work — Dheeraj Kumar | Product Designer" />
  <meta name="description" content="Selected product design case studies by Dheeraj Kumar (Product Designer at Zendesk). Work covers enterprise SaaS workflows, AI copilots, and multi-brand design systems." />
  <meta name="keywords" content="Dheeraj Kumar Work, Product Design Case Studies, Zendesk Designer, Enterprise SaaS UX, AI Workflows" />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://dheerajsorbit.com/work.html" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./assets/images/favicon-16.png" />
  <link rel="apple-touch-icon" href="./assets/images/dheerajsorbit_logo-512.png" />

  <!-- Google Fonts: Arimo (Display) + Roboto (Body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#FFFFFF',
            subdued: '#F5F5F5',
            ink: '#111112',
            secondary: '#706F6F',
            placeholder: '#ABABAB',
            brand: '#EB5624',
            borderSubtle: '#E9E9E9'
          },
          fontFamily: {
            display: ['Arimo', 'sans-serif'],
            body: ['Roboto', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Design System Stylesheet -->
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body class="bg-white text-[#111112] h-screen overflow-hidden flex flex-col justify-between relative selection:bg-[#EB5624] selection:text-white">

  <!-- ==================== BACKGROUND ORBIT DECORATION ==================== -->
  <div class="pointer-events-none absolute inset-0 w-full h-full overflow-hidden z-0" aria-hidden="true">
    <svg class="w-full h-full" viewBox="0 0 1440 900" fill="none" preserveAspectRatio="xMidYMid slice">
      <!-- Clean Orbit Line without planet for Work Page (Field Guide: Work reuses the orbit) -->
      <g transform="translate(435, 485.4) rotate(-16.9)">
        <ellipse cx="757" cy="364" rx="757" ry="364" stroke="#E9E9E9" stroke-width="1" />
      </g>
    </svg>
  </div>

  <!-- ==================== SITE HEADER (Floating Sticky Glass) ==================== -->
  <header class="site-header relative z-20 flex-shrink-0">
    <div class="w-full mx-auto px-[40px] flex items-center justify-between">
      
      <!-- Lockup: 32px Mark + 9px Gap + Arimo Wordmark -->
      <a href="index.html" class="flex items-center gap-[9px] group focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#EB5624] rounded-[2px]" aria-label="Dheeraj Kumar - Home">
        <img 
          src="./assets/images/logo-mark@2x.png" 
          alt="Dheeraj Kumar Logo" 
          class="w-8 h-8 rounded-[2px] object-cover group-hover:scale-105 transition-transform" 
          width="32" 
          height="32" 
        />
        <span class="type-wordmark">Dheeraj Kumar</span>
      </a>

      <!-- Navigation: Work (Active Orange) & About (Ink) -->
      <nav class="flex items-center gap-6 sm:gap-[40px]" aria-label="Main Navigation">
        <a href="work.html" id="nav-work" class="type-navigation text-[#EB5624] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#EB5624] rounded-sm" aria-current="page">
          Work
        </a>
        <a href="about.html" id="nav-about" class="type-navigation text-[#111112] hover:text-[#EB5624] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#EB5624] rounded-sm">
          About
        </a>
      </nav>

    </div>
  </header>

  <!-- ==================== MAIN CONTENT: PASSWORD GATE (458 x 392) ==================== -->
  <main class="relative z-10 flex-1 flex items-center justify-center px-[40px] py-6">
    
    <div class="password-card">
      
      <!-- Key Region: 56px height, 28px key glyph -->
      <div class="h-14 flex items-center justify-center">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#111112" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="7.5" cy="15.5" r="5.5"></circle>
          <path d="m21 2-9.6 9.6"></path>
          <path d="m15.5 7.5 3 3L22 7l-3-3"></path>
        </svg>
      </div>

      <!-- Title: Password required (Arimo 24px / 400 / -0.5px) -->
      <h1 class="type-heading-gate mt-3">
        Password required
      </h1>

      <!-- Subtitle & Email Link -->
      <p class="text-[15px] text-[#706F6F] font-body mt-2 leading-relaxed">
        You need a password to access the work<br />
        <a href="#" id="work-email-link" class="underline text-[#111112] hover:text-[#EB5624] transition-colors js-open-contact" aria-haspopup="dialog">
          Email
        </a> me to get access
      </p>

      <!-- Password Form -->
      <form id="password-form" class="w-full mt-8 flex flex-col items-center">
        <input 
          type="password" 
          id="password-input" 
          class="password-input" 
          placeholder="Enter password" 
          autocomplete="current-password" 
          aria-label="Enter password to access work" 
          required 
        />
        
        <button 
          type="submit" 
          id="unlock-btn" 
          class="password-submit-btn"
        >
          Unlock work
        </button>

        <div id="password-feedback" class="mt-3 text-xs font-medium text-center" aria-live="polite"></div>
      </form>

    </div>

  </main>

  <!-- ==================== SITE FOOTER (Consistent 40px padding & #706F6F colors) ==================== -->
  <footer class="w-full relative z-20 flex-shrink-0 pt-0 pb-[32px]">
    <div class="w-full mx-auto px-[40px] flex items-center justify-between">
      
      <!-- Copyright in #706F6F -->
      <div class="type-footer text-[#706F6F]">
        © 2026 Dheeraj Kumar. All rights reserved.
      </div>

      <!-- Social Icons: Medium & LinkedIn in #706F6F -->
      <div class="flex items-center gap-[22px]">
        <!-- Medium -->
        <a 
          href="https://medium.com/@dheerajkumar" 
          target="_blank" 
          rel="noopener noreferrer" 
          aria-label="Dheeraj Kumar on Medium" 
          class="text-[#706F6F] hover:text-[#EB5624] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#EB5624] rounded-sm p-1"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4 sm:w-5 sm:h-5">
            <circle cx="6.5" cy="12" r="5.5" />
            <ellipse cx="15.5" cy="12" rx="3.5" ry="5.5" />
            <ellipse cx="21.5" cy="12" rx="1.5" ry="5.5" />
          </svg>
        </a>

        <!-- LinkedIn -->
        <a 
          href="https://www.linkedin.com/in/dheerajkumar" 
          target="_blank" 
          rel="noopener noreferrer" 
          aria-label="Dheeraj Kumar on LinkedIn" 
          class="text-[#706F6F] hover:text-[#EB5624] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#EB5624] rounded-sm p-1"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 sm:w-5 sm:h-5">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/>
            <rect width="4" height="12" x="2" y="9"/>
            <circle cx="4" cy="4" r="2"/>
          </svg>
        </a>
      </div>

    </div>
  </footer>

  <!-- ==================== CONTACT MODAL DIALOG ==================== -->
  <div 
    id="contact-modal" 
    class="modal-overlay" 
    role="dialog" 
    aria-modal="true" 
    aria-hidden="true" 
    aria-labelledby="modal-heading"
  >
    <div class="modal-dialog">
      <!-- Close Button (X) -->
      <button 
        type="button" 
        id="modal-close-btn" 
        class="modal-close-btn js-close-contact" 
        aria-label="Close dialog"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <!-- Modal Heading -->
      <h2 id="modal-heading" class="type-heading-dialog mb-8">
        Great work starts<br />with a <span class="text-[#EB5624]">Hello</span>
      </h2>

      <!-- Primary Action: Email Me CTA (400 x 54) -->
      <a 
        href="mailto:dheerajsorbit@gmail.com?subject=Hello%20Dheeraj%20%E2%80%94%20Work%20Access%20Request" 
        class="modal-email-btn"
      >
        <span>Email me</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </a>

      <!-- Copy Email Row (400 x 40) -->
      <div class="modal-copy-row">
        <span id="copy-email-text" class="text-[15px] text-[#111112] font-body">
          dheerajsorbit@gmail.com
        </span>
        <button 
          type="button" 
          id="copy-email-btn" 
          class="modal-copy-btn" 
          aria-label="Copy email address"
        >
          <span id="copy-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="13" height="13" x="9" y="9" rx="2" ry="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
            </svg>
          </span>
        </button>
      </div>

      <!-- Divider -->
      <hr class="w-full border-t border-[#E9E9E9] my-7" />

      <!-- Social Links (LinkedIn & Dribbble, gap 32) -->
      <div class="flex items-center gap-8">
        <a 
          href="https://www.linkedin.com/in/dheerajkumar" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="inline-flex items-center gap-1.5 text-sm font-medium text-[#111112] hover:text-[#EB5624] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#EB5624] rounded-sm"
        >
          <span>LinkedIn</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M7 17L17 7M17 7H7M17 7V17"/>
          </svg>
        </a>

        <a 
          href="https://dribbble.com/dheerajsorbit" 
          target="_blank" 
          rel="noopener noreferrer" 
          class="inline-flex items-center gap-1.5 text-sm font-medium text-[#111112] hover:text-[#EB5624] transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#EB5624] rounded-sm"
        >
          <span>Dribbble</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M7 17L17 7M17 7H7M17 7V17"/>
          </svg>
        </a>
      </div>

    </div>
  </div>

  <!-- Toast Message -->
  <div id="toast-msg" class="toast-msg" role="status" aria-live="polite"></div>

  <!-- Scripts -->
  <script src="./assets/js/main.js"></script>
</body>
</html>
